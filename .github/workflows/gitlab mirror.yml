name: Sync Telegram-Client branch to GitLab main 

on:
  push:
    branches:
      - Telegram-Client   # Trigger only when Telegram-Client branch is updated on GitHub

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # Checkout GitHub repo with full history
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: Telegram-Client
          fetch-depth: 0   # full history (important!)

      # Configure Git
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      # Push GitHub's Telegram-Client branch to GitLab's main
      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@gitlab.com/io-bots/FileStreamBot.git
          git push gitlab Telegram-Client:main --force
